<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Bootstrap Flow — Prompt Üretici</title>
<style>
:root{
  --bg:#f5f5f2; --card:#ffffff; --border:#e2e1db; --text:#1f1f1e; --text-2:#6b6a65; --text-3:#9b9a93;
  --accent:#4f63d2; --accent-bg:#eceefb; --accent-text:#3648a8;
  --ok-bg:#e7f6ec; --ok-text:#1c7c3f; --warn-bg:#fdf3e3; --warn-text:#9a6b16;
  --req-bad:#c96a6a; --req-bad-bg:#f9e9e9; --req-ok:#4b9e77; --req-ok-bg:#e7f4ee;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#151517; --card:#1e1e22; --border:#34343b; --text:#ebebe9; --text-2:#a3a3ab; --text-3:#6f6f78;
  --accent:#7c8cf0; --accent-bg:#2b3050; --accent-text:#aab6ff;
  --ok-bg:#1d3527; --ok-text:#7fd49b; --warn-bg:#3a2f18; --warn-text:#e4b45e;
  --req-bad:#c97777; --req-bad-bg:#3b2626; --req-ok:#61b389; --req-ok-bg:#20372b;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s}
.wrap{max-width:1160px;margin:0 auto;padding:20px 24px 48px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:4px 0 20px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.brand b{font-size:17px;font-weight:600}
.brand span{font-size:12.5px;color:var(--text-3)}
.hdr-ctl{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 13px;font-size:12.5px;color:var(--text-2);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--accent-bg);color:var(--accent-text);font-weight:600}
.icon-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text-2);cursor:pointer}
.icon-btn:hover{color:var(--text);border-color:var(--text-3)}
main{display:grid;gap:20px}
@media(min-width:1020px){main{grid-template-columns:430px minmax(0,1fr);align-items:start}}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
h2{font-size:14px;font-weight:600;margin:0 0 14px}
label{font-size:12px;color:var(--text-2);display:block;margin:0 0 4px}
.field{margin-bottom:12px}
.lbl{display:flex;align-items:center;gap:6px;margin:0 0 4px}
.lbl label{margin:0}
.info{width:15px;height:15px;border-radius:50%;border:1px solid var(--text-3);color:var(--text-3);font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;cursor:help;position:relative;flex:none;line-height:1;user-select:none}
.info:hover,.info:focus{border-color:var(--accent);color:var(--accent-text);outline:none}
.tip{display:none;position:absolute;bottom:calc(100% + 8px);left:-8px;z-index:30;width:min(240px,calc(100vw - 48px));background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.5;color:var(--text);font-weight:400;box-shadow:0 4px 14px rgba(0,0,0,.14);cursor:default;text-align:left}
.info:hover .tip,.info:focus .tip,.info.open .tip{display:block}
.tip-ex{display:block;margin-top:5px;font-family:var(--mono);font-size:11.5px;color:var(--text-2)}
.grid2 .field:nth-child(even) .tip{left:auto;right:-8px}
.check-row{display:flex;align-items:center;gap:8px;margin:14px 0 4px}
.check-row .check{margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
input[type=text],textarea,select{width:100%;padding:8px 10px;font-family:inherit;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;outline:none}
textarea{resize:vertical;min-height:56px;line-height:1.5}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
input[type=text].req-empty,textarea.req-empty,select.req-empty{border-color:var(--req-bad)}
input[type=text].req-filled,textarea.req-filled,select.req-filled{border-color:var(--req-ok)}
input[type=text].req-empty:focus,textarea.req-empty:focus,select.req-empty:focus{border-color:var(--req-bad);box-shadow:0 0 0 3px var(--req-bad-bg)}
input[type=text].req-filled:focus,textarea.req-filled:focus,select.req-filled:focus{border-color:var(--req-ok);box-shadow:0 0 0 3px var(--req-ok-bg)}
.mono{font-family:var(--mono);font-size:13px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text);margin:14px 0 4px;cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.form-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.form-foot small{font-size:12px;color:var(--text-3)}
.ghost-btn{border:1px solid var(--border);background:none;color:var(--text-2);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;font-family:inherit}
.ghost-btn:hover{color:var(--text);border-color:var(--text-3)}
.out-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.out-head b{font-size:14px;font-weight:600}
.out-head span{font-size:12.5px;color:var(--text-3)}
.warn{display:none;background:var(--warn-bg);color:var(--warn-text);font-size:12.5px;padding:8px 12px;border-radius:8px;margin:8px 0 4px}
.warn.show{display:block}
.out-sub{font-size:12.5px;color:var(--text-3);margin:18px 0 2px;padding-top:14px;border-top:1px dashed var(--border)}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-top:12px}
.pc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pc-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.badge{background:var(--accent-bg);color:var(--accent-text);font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;white-space:nowrap}
.pc-count{font-size:12px;color:var(--text-3)}
.copy-btn{border:1px solid var(--border);background:none;color:var(--text);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;white-space:nowrap}
.copy-btn:hover{border-color:var(--accent);color:var(--accent-text)}
.copy-btn.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok-text)}
.guide{font-size:12.5px;color:var(--text-2);margin:8px 0 10px;line-height:1.5}
pre{margin:0;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--text-2);max-height:250px;overflow:auto;white-space:pre-wrap;word-break:break-word}
footer{margin-top:28px;font-size:12px;color:var(--text-3);text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <div class="logo">B</div>
    <div><b>Bootstrap Flow</b><br><span id="t-subtitle">prompt üretici</span></div>
  </div>
  <div class="hdr-ctl">
    <div class="seg" id="lang-seg">
      <button type="button" data-lang="tr">TR</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <button type="button" class="icon-btn" id="theme-btn" aria-label="Tema">
      <svg id="ic-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg id="ic-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main>
<section class="card">
  <h2 id="t-formTitle">Proje bilgileri</h2>
  <div class="field"><div class="lbl"><label id="l-name" for="f-name">Proje adı</label><span class="info" tabindex="0">i<span class="tip" id="tip-name"></span></span></div><input type="text" id="f-name"></div>
  <div class="field"><div class="lbl"><label id="l-root" for="f-root">Kök klasör yolu</label><span class="info" tabindex="0">i<span class="tip" id="tip-root"></span></span></div><input type="text" id="f-root" class="mono"></div>
  <div class="field"><div class="lbl"><label id="l-desc" for="f-desc">Kısa açıklama</label><span class="info" tabindex="0">i<span class="tip" id="tip-desc"></span></span></div><textarea id="f-desc"></textarea></div>
  <div class="grid2">
    <div class="field"><div class="lbl"><label id="l-type" for="f-type">Proje tipi</label><span class="info" tabindex="0">i<span class="tip" id="tip-type"></span></span></div><select id="f-type"></select></div>
    <div class="field"><div class="lbl"><label id="l-tech" for="f-tech">Teknoloji</label><span class="info" tabindex="0">i<span class="tip" id="tip-tech"></span></span></div><input type="text" id="f-tech"></div>
  </div>
  <div class="field"><div class="lbl"><label id="l-mvp" for="f-mvp">MVP hedefi</label><span class="info" tabindex="0">i<span class="tip" id="tip-mvp"></span></span></div><textarea id="f-mvp"></textarea></div>
  <div class="field"><div class="lbl"><label id="l-commands" for="f-commands">Komutlar (opsiyonel)</label><span class="info" tabindex="0">i<span class="tip" id="tip-commands"></span></span></div><textarea id="f-commands" style="min-height:38px"></textarea></div>
  <div class="grid2">
    <div class="field"><div class="lbl"><label id="l-agent" for="f-agent">Agent tipi</label><span class="info" tabindex="0">i<span class="tip" id="tip-agent"></span></span></div><select id="f-agent"></select></div>
    <div class="field"><div class="lbl"><label id="l-promptLang" for="f-promptlang">Prompt dili</label><span class="info" tabindex="0">i<span class="tip" id="tip-promptLang"></span></span></div><select id="f-promptlang"></select></div>
  </div>
  <div class="grid2">
    <div class="field"><div class="lbl"><label id="l-respLang" for="f-resplang">Cevap dili</label><span class="info" tabindex="0">i<span class="tip" id="tip-respLang"></span></span></div><select id="f-resplang"></select></div>
    <div class="field"><div class="lbl"><label id="l-notes" for="f-notes">Ek notlar (opsiyonel)</label><span class="info" tabindex="0">i<span class="tip" id="tip-notes"></span></span></div><textarea id="f-notes" style="min-height:38px"></textarea></div>
  </div>
  <div class="check-row"><label class="check"><input type="checkbox" id="f-code"><span id="l-code">Bootstrap sırasında kod yazılsın</span></label><span class="info" tabindex="0">i<span class="tip" id="tip-code"></span></span></div>
  <div class="form-foot">
    <small id="t-autosave">Form otomatik kaydedilir</small>
    <button type="button" class="ghost-btn" id="clear-btn">Formu temizle</button>
  </div>
</section>

<section>
  <div class="out-head"><b id="t-outTitle">Üretilen promptlar</b><span id="t-outHint">sırayla agent'a verin</span></div>
  <div class="warn" id="warn"></div>
  <div class="pcard" id="pc-0">
    <div class="pc-top"><div class="pc-meta"><span class="badge" id="b-0">1. Anlama ve plan</span><span class="pc-count" id="c-0"></span></div><button type="button" class="copy-btn" data-i="0">Kopyala</button></div>
    <p class="guide" id="g-0"></p>
    <pre id="p-0"></pre>
  </div>
  <div class="pcard" id="pc-1">
    <div class="pc-top"><div class="pc-meta"><span class="badge" id="b-1">2. Bootstrap</span><span class="pc-count" id="c-1"></span></div><button type="button" class="copy-btn" data-i="1">Kopyala</button></div>
    <p class="guide" id="g-1"></p>
    <pre id="p-1"></pre>
  </div>
  <div class="pcard" id="pc-2">
    <div class="pc-top"><div class="pc-meta"><span class="badge" id="b-2">3. Doğrulama</span><span class="pc-count" id="c-2"></span></div><button type="button" class="copy-btn" data-i="2">Kopyala</button></div>
    <p class="guide" id="g-2"></p>
    <pre id="p-2"></pre>
  </div>
  <div class="out-sub" id="t-resumeHead">Sonraki oturumlar için</div>
  <div class="pcard" id="pc-3">
    <div class="pc-top"><div class="pc-meta"><span class="badge" id="b-3">4. Devam / Güncelle</span><span class="pc-count" id="c-3"></span></div><button type="button" class="copy-btn" data-i="3">Kopyala</button></div>
    <p class="guide" id="g-3"></p>
    <pre id="p-3"></pre>
  </div>
</section>
</main>

<footer id="t-footer"></footer>
</div>

${d.root} içinde çalış.
1. İzleme dosyalarını şu sırayla oku (olmayanları atla): README.md, PROJECT_BRIEF.md, REQUIREMENTS.md, DESIGN.md, TASKS.md, ROADMAP.md, DECISIONS.md, CHANGELOG.md, LESSONS.md, AGENTS.md.
2. Projenin gerçek durumunu incele: src/, tests/ ve diğer klasörlerin içeriği; depo varsa git geçmişi.
3. TASKS.md'yi gerçeklikle mutabık kıl:
   - yapılmış ama işaretlenmemiş görevler,
   - işaretli ama gerçekle örtüşmeyen görevler,
   - projede var olan ama hiçbir göreve bağlı olmayan işler,
   - artık geçersiz görevler.
4. CHANGELOG.md bulduğun işleri yansıtıyor mu kontrol et; eksik kayıtları not et.
5. TASKS.md ve CHANGELOG.md için birebir düzenlemeler içeren bir güncelleme önerisi hazırla (yalnızca açıkça gerekiyorsa DECISIONS.md veya LESSONS.md da eklenebilir). Başka hiçbir dosyada değişiklik önerme.
6. MVP hedefine — MVP bittiyse yol haritasındaki sonraki maddeye — giden en mantıklı 1-3 adımı öner.

# ÇIKTI
${d.resp} dilinde, şu yapıyla cevap ver:
${d.struct4}

# DURMA KURALI
Cevabını tam olarak şu soruyla bitir ve dur:
${d.q4}`
};

function defaults() {
  return {
    ui: { lang: "tr", theme: null },
    f: { name: "", root: "", desc: "", type: "", tech: "", mvp: "", commands: "", agent: "Claude Code", promptLang: "en", respLang: "tr", notes: "", code: false }
  };
}

let state;
try {
  const raw = JSON.parse(localStorage.getItem(LS_KEY));
  state = raw && raw.ui && raw.f ? raw : defaults();
} catch (e) { state = defaults(); }
if (state.f.agent === "Agent") state.f.agent = "a coding agent";

function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }

const TIP_KEYS = ["name", "root", "desc", "type", "tech", "mvp", "commands", "agent", "promptLang", "respLang", "notes", "code"];
const REQUIRED_IDS = ["f-name", "f-root", "f-desc", "f-type", "f-tech", "f-mvp"];

function updateReqStyles() {
  REQUIRED_IDS.forEach(id => {
    const el = $(id);
    const filled = (el.value || "").trim() !== "";
    el.classList.toggle("req-empty", !filled);
    el.classList.toggle("req-filled", filled);
  });
}

const FIELD_MAP = [
  ["f-name", "name"], ["f-root", "root"], ["f-desc", "desc"], ["f-tech", "tech"],
  ["f-mvp", "mvp"], ["f-commands", "commands"], ["f-notes", "notes"]
];
const SELECT_MAP = [["f-type", "type"], ["f-agent", "agent"], ["f-promptlang", "promptLang"], ["f-resplang", "respLang"]];

function buildSelects() {
  const L = I18N[state.ui.lang];
  const type = $("f-type");
  type.innerHTML = "";
  const opt0 = document.createElement("option");
  opt0.value = ""; opt0.textContent = L.typePlaceholder;
  type.appendChild(opt0);
  TYPE_KEYS.forEach(k => {
    const o = document.createElement("option");
    o.value = k; o.textContent = L.typeNames[k];
    type.appendChild(o);
  });
  type.value = state.f.type;

  const ag = $("f-agent");
  ag.innerHTML = "";
  AGENTS.concat([L.agentOther]).forEach(a => {
    const o = document.createElement("option");
    o.value = a === L.agentOther ? "a coding agent" : a;
    o.textContent = a;
    ag.appendChild(o);
  });
  ag.value = state.f.agent;

  const pl = $("f-promptlang");
  pl.innerHTML = "";
  ["en", "tr"].forEach(k => {
    const o = document.createElement("option");
    o.value = k; o.textContent = L.promptLangs[k];
    pl.appendChild(o);
  });
  pl.value = state.f.promptLang;

  const rl = $("f-resplang");
  rl.innerHTML = "";
  ["tr", "en"].forEach(k => {
    const o = document.createElement("option");
    o.value = k; o.textContent = L.respLangs[k];
    rl.appendChild(o);
  });
  rl.value = state.f.respLang;
}

function applyLabels() {
  const L = I18N[state.ui.lang];
  document.documentElement.lang = state.ui.lang;
  $("t-subtitle").textContent = L.subtitle;
  $("t-formTitle").textContent = L.formTitle;
  ["name", "root", "desc", "type", "tech", "mvp", "commands", "agent", "promptLang", "respLang", "notes", "code"].forEach(k => {
    $("l-" + k).textContent = L[k];
  });
  $("t-autosave").textContent = L.autosave;
  $("clear-btn").textContent = L.clear;
  $("t-outTitle").textContent = L.outTitle;
  $("t-outHint").textContent = L.outHint;
  $("t-footer").textContent = L.footer;
  $("b-0").textContent = L.p1; $("b-1").textContent = L.p2; $("b-2").textContent = L.p3; $("b-3").textContent = L.p4;
  $("g-0").textContent = L.g1; $("g-1").textContent = L.g2; $("g-2").textContent = L.g3; $("g-3").textContent = L.g4;
  $("t-resumeHead").textContent = L.resumeHead;
  document.querySelectorAll(".copy-btn").forEach(b => { if (!b.classList.contains("ok")) b.textContent = L.copy; });
  $("f-name").placeholder = L.phName;
  $("f-root").placeholder = L.phRoot;
  $("f-desc").placeholder = L.phDesc;
  $("f-notes").placeholder = L.phNotes;
  $("f-commands").placeholder = L.phCommands;
  TIP_KEYS.forEach(k => {
    const el = $("tip-" + k);
    const tp = L.tips[k];
    el.textContent = tp.t;
    const ex = document.createElement("span");
    ex.className = "tip-ex";
    ex.textContent = tp.e;
    el.appendChild(ex);
  });
  document.querySelectorAll(".info").forEach(el => el.setAttribute("aria-label", L.infoLabel));
  applyHints();
  document.querySelectorAll("#lang-seg button").forEach(b => b.classList.toggle("on", b.dataset.lang === state.ui.lang));
}

function applyHints() {
  const lang = state.ui.lang;
  const h = TYPE_HINTS[state.f.type];
  $("f-tech").placeholder = h ? h[lang].tech : "";
  $("f-mvp").placeholder = h ? h[lang].mvp : "";
}

let prompts = ["", "", "", ""];

function renderPrompts() {
  const L = I18N[state.ui.lang];
  const f = state.f;
  const PL = f.promptLang;
  const TP = I18N[PL];
  const fb = PL === "en" ? "(not specified)" : "(belirtilmedi)";
  const v = (x, alt) => { x = (x || "").trim(); return x || alt; };

  const codeRule = PL === "en"
    ? (f.code
        ? "Code writing IS allowed: create only a minimal entry point in src/, nothing more."
        : "Code writing is NOT allowed: write NO application code; src/ contains only .gitkeep.")
    : (f.code
        ? "Kod yazma İZNİ VAR: src/ içinde yalnızca minimal bir giriş noktası oluştur, fazlasını yazma."
        : "Kod yazma izni YOK: hiçbir uygulama kodu yazma; src/ yalnızca .gitkeep içersin.");
  const scopeRule = PL === "en"
    ? (f.code
        ? "Code writing was allowed: verify src/ contains only a minimal entry point, nothing more."
        : "Code writing was NOT allowed: verify no application code exists in src/.")
    : (f.code
        ? "Kod yazma izni VARDI: src/ içinde yalnızca minimal bir giriş noktası olduğunu doğrula."
        : "Kod yazma izni YOKTU: src/ içinde hiçbir uygulama kodu bulunmadığını doğrula.");

  const d = {
    name: v(f.name, fb), root: v(f.root, fb), desc: v(f.desc, fb),
    type: f.type ? TP.typeNames[f.type] : fb,
    tech: v(f.tech, fb), mvp: v(f.mvp, fb),
    commands: v(f.commands, PL === "en" ? "not provided — infer the build, test and run commands from the tech stack and project files" : "verilmedi — build, test ve çalıştırma komutlarını teknolojiden ve proje dosyalarından çıkar"),
    agent: f.agent || "Claude Code",
    notes: v(f.notes, PL === "en" ? "None" : "Yok"),
    code: PL === "en" ? (f.code ? "yes" : "no") : (f.code ? "evet" : "hayır"),
    codeRule, scopeRule,
    resp: PL === "en" ? (f.respLang === "tr" ? "Turkish" : "English") : (f.respLang === "tr" ? "Türkçe" : "İngilizce")
  };
  const rs = RESP_STRINGS[f.respLang] || RESP_STRINGS.en;
  d.struct1 = rs.p1struct; d.q1 = rs.p1q;
  d.struct2 = rs.p2struct; d.end2 = rs.p2end;
  d.struct3 = rs.p3struct; d.q3 = rs.p3q;
  d.struct4 = rs.p4struct; d.q4 = rs.p4q;

  const T = PL === "en" ? T_EN : T_TR;
  prompts = [T.p1(d), T.p2(d), T.p3(d), T.p4(d)];
  const loc = state.ui.lang === "tr" ? "tr-TR" : "en-US";
  prompts.forEach((p, i) => {
    $("p-" + i).textContent = p;
    $("c-" + i).textContent = p.length.toLocaleString(loc) + " " + L.chars;
  });

  const required = [["name", L.name], ["root", L.root], ["desc", L.desc], ["type", L.type], ["tech", L.tech], ["mvp", L.mvp]];
  const missing = required.filter(([k]) => !(f[k] || "").trim()).map(([, lbl]) => lbl);
  const warn = $("warn");
  if (missing.length) {
    warn.textContent = L.missing + " " + missing.join(", ");
    warn.classList.add("show");
  } else {
    warn.classList.remove("show");
  }
  updateReqStyles();
}

function applyTheme() {
  let t = state.ui.theme;
  if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
  $("ic-moon").style.display = t === "light" ? "" : "none";
  $("ic-sun").style.display = t === "dark" ? "" : "none";
}

FIELD_MAP.forEach(([id, key]) => {
  const el = $(id);
  el.value = state.f[key];
  el.addEventListener("input", () => { state.f[key] = el.value; save(); renderPrompts(); });
});
SELECT_MAP.forEach(([id, key]) => {
  $(id).addEventListener("change", e => {
    state.f[key] = e.target.value;
    save();
    if (key === "type") applyHints();
    renderPrompts();
  });
});
$("f-code").checked = state.f.code;
$("f-code").addEventListener("change", e => { state.f.code = e.target.checked; save(); renderPrompts(); });

document.querySelectorAll("#lang-seg button").forEach(b => {
  b.addEventListener("click", () => {
    state.ui.lang = b.dataset.lang;
    save();
    buildSelects();
    applyLabels();
    renderPrompts();
  });
});

$("theme-btn").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme;
  state.ui.theme = cur === "dark" ? "light" : "dark";
  save();
  applyTheme();
});

$("clear-btn").addEventListener("click", () => {
  if (!confirm(I18N[state.ui.lang].confirmClear)) return;
  state.f = defaults().f;
  save();
  FIELD_MAP.forEach(([id, key]) => { $(id).value = state.f[key]; });
  $("f-code").checked = false;
  buildSelects();
  applyHints();
  renderPrompts();
});

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "absolute";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  const L = I18N[state.ui.lang];
  btn.classList.add("ok");
  btn.textContent = L.copied;
  setTimeout(() => { btn.classList.remove("ok"); btn.textContent = I18N[state.ui.lang].copy; }, 1500);
}

document.querySelectorAll(".copy-btn").forEach(b => {
  b.addEventListener("click", () => copyText(prompts[Number(b.dataset.i)], b));
});

document.querySelectorAll(".info").forEach(el => {
  el.addEventListener("click", e => {
    e.stopPropagation();
    document.querySelectorAll(".info.open").forEach(o => { if (o !== el) o.classList.remove("open"); });
    el.classList.toggle("open");
  });
});
document.addEventListener("click", () => {
  document.querySelectorAll(".info.open").forEach(o => o.classList.remove("open"));
});

applyTheme();
buildSelects();
applyLabels();
renderPrompts();
</script>
</body>
</html>
